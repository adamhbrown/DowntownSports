<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 DSI World Cup Matrix</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        /* Cinematic Entrance */
        #stadium-entrance {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #020617; z-index: 9999; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; transition: opacity 1.2s ease;
        }
        .intro-text { font-family: 'Arial Black', sans-serif; font-size: 3rem; color: #fff; margin-bottom: 30px; text-transform: uppercase; animation: flicker 2s infinite; }
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .entrance-btn { background: #00f3ff; color: #000; font-weight: bold; padding: 20px 40px; border: none; cursor: pointer; text-transform: uppercase; border-radius: 4px; box-shadow: 0 0 50px #00f3ff; }

        /* Dashboard Styles */
        body { background-color: #020617; color: #f8fafc; font-family: 'Arial Black', sans-serif; margin: 0; }
        .ticker-wrap { width: 100%; background: #00f3ff; color: #020617; padding: 10px 0; overflow: hidden; white-space: nowrap; font-weight: bold; }
        header { text-align: center; padding: 30px; }
        .tab-bar { display: flex; justify-content: center; gap: 10px; padding: 10px; background: #0f172a; }
        .tab-btn { background: #1e293b; color: #fff; border: none; padding: 10px 20px; cursor: pointer; }
        .tab-btn.active { background: #0066ff; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        .card { background: #0f172a; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #1e293b; }
        table { width: 100%; border-collapse: collapse; font-family: sans-serif; }
        th { background: #0b1329; color: #00f3ff; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #1e293b; }
        .admin-protected { display: none; }
    </style>
</head>
<body>

    <div id="stadium-entrance">
        <div class="intro-text">DSI 2026: WORLD CUP MATRIX</div>
        <button class="entrance-btn" onclick="exitLockerRoom()">Enter The Matrix</button>
    </div>

    <div class="ticker-wrap">★ PLAY LIKE A GOAT • THE GOATS PLAY HERE • CAN’T STOP THE BAA ★ DOWNTOWN SPORTS NETWORK OVERDRIVE ★</div>

    <header>
        <h1>2026 DSI <span>WORLD CUP</span></h1>
        <input type="password" id="commish-key-input" placeholder="🔒 Commish Access" oninput="evalCommishPrivileges()" style="background:#0f172a; border:1px solid #334155; padding:8px; color:#fff;">
    </header>

    <nav class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('tournament-hub', this)">🐐 League Room</button>
        <button class="tab-btn" onclick="switchTab('ko-hub', this)">🏆 Knockout Bracket</button>
        <button class="tab-btn" onclick="switchTab('golden-boot-hub', this)">👟 Golden Boot</button>
    </nav>

    <div id="tournament-hub" class="tab-content active">
        <div class="card">
            <h3>📊 Group Standings (A-L)</h3>
            <div id="master-groups-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px;"></div>
        </div>
    </div>

    <div id="ko-hub" class="tab-content">
        <div class="card">
            <h3>🏆 Knockout Stage Bracket</h3>
            <p style="color:#64748b;">Bracket logic loading...</p>
        </div>
    </div>

    <div id="golden-boot-hub" class="tab-content">
        <div class="card"><h3>👟 Golden Boot Race</h3></div>
    </div>

    <script>
        function exitLockerRoom() { document.getElementById('stadium-entrance').style.opacity = '0'; setTimeout(() => document.getElementById('stadium-entrance').style.display = 'none', 1200); }
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
            document.getElementById(tabId).classList.add('active'); el.classList.add('active');
        }
        function evalCommishPrivileges() {
            const val = document.getElementById('commish-key-input').value;
            document.querySelectorAll('.admin-protected').forEach(el => el.style.display = (val === "downtown2026") ? "block" : "none");
        }
        
        const tournamentGroups = { "A": ["MEXICO", "SOUTH KOREA", "SOUTH AFRICA", "CZECH REPUBLIC"], "B": ["CANADA", "SWITZERLAND", "QATAR", "BOSNIA & HERZEGOVINA"], "C": ["BRAZIL", "MOROCCO", "SCOTLAND", "HAITI"], "D": ["UNITED STATES", "AUSTRALIA", "PARAGUAY", "TURKEY"], "E": ["GERMANY", "ECUADOR", "IVORY COAST", "CURACAO"], "F": ["NETHERLANDS", "JAPAN", "TUNISIA", "SWEDEN"], "G": ["BELGIUM", "EGYPT", "IRAN", "NEW ZEALAND"], "H": ["SPAIN", "URUGUAY", "SAUDI ARABIA", "CABO VERDE"], "I": ["FRANCE", "SENEGAL", "NORWAY", "IRAQ"], "J": ["ARGENTINA", "ALGERIA", "AUSTRIA", "JORDAN"], "K": ["PORTUGAL", "COLOMBIA", "UZBEKISTAN", "CONGO"], "L": ["ENGLAND", "CROATIA", "PANAMA", "GHANA"] };

        function generateGroupsHTML() {
            const container = document.getElementById('master-groups-grid');
            Object.keys(tournamentGroups).forEach(gName => {
                let html = `<div class="card"><h4>Group ${gName}</h4><table><thead><tr><th>Team</th><th>PTS</th><th>Rec</th><th>GF</th><th>GA</th></tr></thead><tbody>`;
                tournamentGroups[gName].forEach(team => {
                    html += `<tr><td>${team}</td><td>0</td><td>0-0-0</td><td>0</td><td>0</td></tr>`;
                });
                html += `</tbody></table></div>`;
                container.innerHTML += html;
            });
        }
        window.onload = generateGroupsHTML;
    </script>
</body>
</html>
